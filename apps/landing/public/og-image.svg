
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
          <stop stop-color="#0A0D16" />
          <stop offset="0.6" stop-color="#0A0D16" />
          <stop offset="1" stop-color="#05070C" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="80" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="30" />
        </filter>
        <linearGradient id="archGrad" x1="850" y1="250" x2="850" y2="630" gradientUnits="userSpaceOnUse">
          <stop stop-color="rgba(201,167,105,0.15)" />
          <stop offset="1" stop-color="rgba(201,167,105,0)" />
        </linearGradient>
      </defs>

      <rect width="1200" height="630" fill="url(#bg)" />

      <!-- Abstract floating orbs / gradients: warm lamplight (gold) + blue-hour night sky, calm and premium -->
      <circle cx="900" cy="150" r="180" fill="rgba(201,167,105,0.14)" filter="url(#glow)" />
      <circle cx="1050" cy="450" r="280" fill="rgba(27,42,74,0.45)" filter="url(#glow)" />
      <circle cx="600" cy="300" r="300" fill="rgba(226,152,76,0.05)" filter="url(#glow)" />

      <!-- Minimalist arch accent (subtle Islamic geometric nod) -->
      <path d="M 800 630 L 800 300 A 180 180 0 0 1 1160 300 L 1160 630" stroke="url(#archGrad)" stroke-width="2" fill="none" filter="url(#softGlow)" />
      <path d="M 780 630 L 780 300 A 200 200 0 0 1 1180 300 L 1180 630" stroke="rgba(201,167,105,0.05)" stroke-width="1" fill="none" />

      <text x="100" y="100" fill="#C9A769" font-size="24" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2">imaan.app</text>
      <text x="100" y="250" fill="#F4F0E6" font-size="76" font-family="Georgia, serif" font-weight="400" letter-spacing="0.5">Prayer streaks</text><text x="100" y="342" fill="#F4F0E6" font-size="76" font-family="Georgia, serif" font-weight="400" letter-spacing="0.5">with friends.</text>
      <text x="100" y="500" fill="#AFB4C4" font-size="28" font-family="Arial, sans-serif" font-weight="400">Confirm salah, keep your run alive, and climb</text><text x="100" y="536" fill="#AFB4C4" font-size="28" font-family="Arial, sans-serif" font-weight="400">the leaderboard with friends.</text>
    </svg>
  